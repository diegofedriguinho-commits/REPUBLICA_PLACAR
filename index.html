<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REPUBLICA O RETORNO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center;font-family:Arial Black,Arial}
.app{width:100%;max-width:400px;background:#000;border:2px solid #d4a017;display:flex;flex-direction:column;min-height:100vh}
.topo{background:#000;padding:8px 10px;text-align:center;border-bottom:2px solid #d4a017;display:flex;align-items:center;justify-content:center;gap:8px}
.topo img{width:200px;height:200px;border-radius:50%;border:2px solid #d4a017;flex-shrink:0;box-shadow:0 0 6px #d4a017}
.topo h1{color:#d4a017;font-size:12px;letter-spacing:1px;line-height:1;text-align:left}
.topo .sub{color:#d4a017aa;font-size:6px;letter-spacing:1px;font-family:Arial;display:block;margin-top:2px}
.banner{background:#d4a017;color:#000;text-align:center;padding:5px;font-weight:900;font-size:11px;letter-spacing:1px}
.pontos{background:#0a0a0a;border:2px solid #d4a017;margin:4px;padding:8px;text-align:center;border-radius:6px}
.tit{color:#d4a017aa;font-size:9px;letter-spacing:1px}
.placar{display:flex;justify-content:center;gap:12px;align-items:center;margin:4px 0}
.n{font-size:44px;color:#f1d585;line-height:1;font-weight:900;text-shadow:0 0 8px #d4a017}
.s{color:#d4a017aa;font-size:18px}
.meta{color:#d4a017aa;font-size:8px;font-family:Arial}
.acoes-pontos{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.acoes-pontos button{border:1.5px solid;padding:9px 3px;border-radius:5px;font-weight:900;font-size:9px;touch-action:manipulation}
.btn-menos{background:#1a1a1a;color:#ff6b6b;border-color:#ff6b6b}
.btn-mais{background:#1a1a1a;color:#25D366;border-color:#25D366}
.btn-truco{background:#d4a017;color:#000;border-color:#d4a017}
.acoes-pontos button:active{transform:scale(0.92)}
.acoes-gerais{display:flex;gap:3px;margin-top:5px}
.acoes-gerais button{flex:1;border:1px solid #d4a017;padding:6px;border-radius:4px;font-weight:900;font-size:8px;background:#1a1a1a;color:#d4a017}
.duplo{display:flex;gap:4px;padding:0 4px 4px}
.box{flex:1;background:#000;border:2px solid #d4a017;padding:6px;text-align:center;border-radius:6px}
.box h3{color:#f1d585;font-size:13px}
.vit{color:#d4a017aa;font-size:8px;margin-top:5px}
.vit b{font-size:32px;color:#f1d585;display:block;line-height:1;text-shadow:0 0 6px #d4a017}
.btns{display:flex;gap:4px;margin-top:4px}
.btns button{flex:1;background:#000;border:1px solid #d4a017;color:#f1d585;padding:7px;border-radius:4px;font-weight:900;font-size:11px}
.bottom{margin:4px;background:#000;border:1px solid #d4a01799;padding:5px;display:flex;justify-content:space-around;text-align:center;color:#d4a017aa;font-size:7px;font-family:Arial;border-radius:5px;margin-top:auto}
.bottom span{font-size:11px;display:block}
</style>
</head>
<body>
<div class="app">

<div class="topo">
<img src="./foto.jpg">
<div>
<h1>REPUBLICA O RETORNO</h1>
<span class="sub">SINCE 2023</span>
</div>
</div>

<div class="banner">★ AQUI A MAGIA ACONTECE ★</div>

<div class="pontos">
<div class="tit">PONTOS DA PARTIDA</div>
<div class="placar"><div class="n" id="pn">0</div><div class="s">—</div><div class="n" id="pe">0</div></div>
<div class="meta" id="meta">Meta: 12 • Rodada 1/12</div>

<div class="acoes-pontos">
<button class="btn-menos" onclick="pt('nos',-1)">-1 NÓS</button>
<button class="btn-mais" onclick="pt('nos',1)">+1 NÓS</button>
<button class="btn-menos" onclick="pt('eles',-1)">-1 ELES</button>
<button class="btn-mais" onclick="pt('eles',1)">+1 ELES</button>
<button class="btn-truco" onclick="pt('nos',3)">+3 TRUCO</button>
<button class="btn-truco" onclick="pt('eles',3)">+3 TRUCO</button>
</div>

<div class="acoes-gerais">
<button onclick="zerar()">↻ REINICIAR</button>
<button onclick="zerar()">Zerar</button>
<button style="background:#d4a017;color:#000" onclick="novo()">NOVO JOGO</button>
</div>
</div>

<div class="duplo">
<div class="box">
<h3>NOS 🇧🇷</h3>
<div class="vit">VITÓRIAS<b id="vn">0</b></div>
<div class="btns"><button onclick="vit('nos',-1)">-1</button><button onclick="vit('nos',1)">+1</button></div>
</div>
<div class="box">
<h3>ELES 🛡️</h3>
<div class="vit">VITÓRIAS<b id="ve">0</b></div>
<div class="btns"><button onclick="vit('eles',-1)">-1</button><button onclick="vit('eles',1)">+1</button></div>
</div>
</div>

<div class="bottom"><div><span>🍢</span>Churrasco</div><div><span>🍺</span>Cerveja</div><div><span>🍹</span>Caipirinha</div></div>

</div>

<script>
let pn=0,pe=0,vn=0,ve=0,rod=1;
function pt(t,v){if(t=='nos'){pn+=v;if(pn<0)pn=0;if(pn>12)pn=12;document.getElementById('pn').innerText=pn;check()}else{pe+=v;if(pe<0)pe=0;if(pe>12)pe=12;document.getElementById('pe').innerText=pe;check()}}
function check(){if(pn==12||pe==12){if(pn==12){vn++;document.getElementById('vn').innerText=vn}else{ve++;document.getElementById('ve').innerText=ve}pn=0;pe=0;rod++;document.getElementById('pn').innerText='0';document.getElementById('pe').innerText='0';document.getElementById('meta').innerText=`Meta: 12 • Rodada ${rod}/12`}}
function vit(t,v){if(t=='nos'){vn+=v;if(vn<0)vn=0;document.getElementById('vn').innerText=vn}else{ve+=v;if(ve<0)ve=0;document.getElementById('ve').innerText=ve}}
function zerar(){pn=0;pe=0;document.getElementById('pn').innerText='0';document.getElementById('pe').innerText='0'}
function novo(){if(confirm('Novo jogo?')){pn=0;pe=0;vn=0;ve=0;rod=1;document.getElementById('pn').innerText='0';document.getElementById('pe').innerText='0';document.getElementById('vn').innerText='0';document.getElementById('ve').innerText='0';document.getElementById('meta').innerText='Meta: 12 • Rodada 1/12'}}
</script>
</body>
</html>
